name = "hs-dashboard"
main = "worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*", "/archive*", "/data*"]

# Optional per-IP limit for /api/v1 (the code works without the binding).
[[ratelimits]]
name = "RL_IP"
namespace_id = "2001"
simple = { limit = 600, period = 60 }

# Workers Builds runs `wrangler preview` for branches other than main. A Preview gets its own
# rate-limit namespace (2002) so preview traffic never shares production's counters.
[[previews.ratelimits]]
name = "RL_IP"
namespace_id = "2002"
simple = { limit = 600, period = 60 }
