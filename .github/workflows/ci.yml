name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # jsonschema for `hsdash.py validate` and tests/test_validate.py (dev and CI only; pinned).
      - name: Dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python tests (network blocked)
        env:
          PYTHONPATH: tests/netguard
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Worker contract tests
        run: node --test "tests/*.test.mjs"
      - name: Derived files are up to date
        run: python hsdash.py build --check --export
      - name: Published files match their schemas (committed tree)
        run: python hsdash.py validate
      - name: Published files match their schemas (a fresh build in a temp directory)
        run: python hsdash.py validate --fresh
