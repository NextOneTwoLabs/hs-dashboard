name: Refresh data

# Fall, winter and spring state tournaments overlap, so this runs all year:
# every 30 minutes from mid-morning to late evening US time. The crawler only
# fetches competitions that are live (inside a configured window, or with
# unfinished brackets whose dates are near today) and exits without any
# request otherwise. Mondays it also lists the active season's MaxPreps
# tournaments into archive/discovered/ for review (nothing is registered).
on:
  schedule:
    - cron: "*/30 0-6,15-23 * * *"
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh (live competitions only) or backfill (all incomplete seasons)"
        default: refresh
        type: choice
        options: [refresh, backfill]

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover tournaments (weekly)
        if: github.event.schedule == '0 9 * * 1'
        run: |
          season=$(python -c "import json; print(json.load(open('public/data/sources.json'))['activeSeason'])")
          python -m crawler.hs --discover "$season"
      - name: Crawl
        if: github.event.schedule != '0 9 * * 1'
        run: python -m crawler.hs --${{ inputs.mode || 'refresh' }} --export
      - name: Commit changes
        run: |
          git config user.name "hs-dashboard-bot"
          git config user.email "hs-dashboard-bot@users.noreply.github.com"
          git add -A archive public/archive export
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
