<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>High School Girls Soccer</title>
  <meta name="description" content="US high school girls soccer state championship brackets, results, champions and school histories, state by state.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <script>
    try {
      const t = localStorage.getItem('hs-theme');
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <header class="header" id="header">
    <div class="header-left">
      <button class="hamburger" id="sidebar-toggle" type="button" aria-label="Show filters" aria-controls="sidebar" aria-expanded="true">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="2"/><path d="M7.5 4v12"/></svg>
      </button>
      <a class="wordmark" href="https://www.nextonetwo.com"><img src="/assets/logo.svg" alt="" width="32" height="32">next<span class="accent">one</span>two</a>
      <div class="header-divider" aria-hidden="true"></div>
      <a class="section-label" href="#tab=teams">High School Girls Soccer</a>
    </div>
    <!-- The Main nav (#20): here on wider screens, the bottom bar on phones; only one is displayed (app.js fills both). -->
    <nav class="header-nav" aria-label="Main" id="main-nav">
      <a class="main-nav-link" href="#tab=teams"><span>Teams</span></a>
      <a class="main-nav-link" href="#tab=results"><span>Results</span></a>
      <a class="main-nav-link" href="#tab=playoffs"><span>Playoffs</span></a>
    </nav>
    <div class="header-search search" id="search" role="search">
      <input type="search" class="search-input" id="search-input" role="combobox" aria-label="Search schools, cities, states" aria-autocomplete="list" aria-controls="search-list" aria-expanded="false" aria-describedby="search-hint" placeholder="School, city or state…  /" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <span class="sr-only" id="search-hint">Type a school, a city, a state or an association. Down arrow for suggestions.</span>
      <div class="qpanel" id="search-panel" hidden><div role="listbox" id="search-list" aria-label="Suggestions" class="qlist"></div></div>
      <span class="sr-only" id="search-status" role="status"></span>
    </div>
    <div class="header-right">
      <span class="observed-top" id="data-updated"></span>
      <a class="header-link" href="#tab=about">About the data</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8C12.92 3.04 12.46 3 12 3z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout" id="layout">
    <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="Filters">
      <div class="controls" id="controls"></div>
      <div class="drawer-show"><button class="btn primary" type="button" id="drawer-done">Show results</button></div>
    </aside>
    <div class="main" id="main">
      <div class="content-header">
        <div class="content-header-row" id="page-head"></div>
        <!-- Playoffs › Brackets · Champions (shown on Playoffs only). -->
        <nav class="view-tabs" aria-label="Playoffs" id="tabs" hidden></nav>
      </div>
      <div class="content-body" id="view"></div>
      <footer class="footer">
        <span id="status-line">US high school girls soccer state championships. Brackets from state associations via MaxPreps.</span>
        <a class="footer-about" href="#tab=about">About the data</a>
        <span class="footer-updated" id="data-updated-foot"></span>
      </footer>
    </div>
  </div>
  <nav class="bottom-nav" aria-label="Main" id="bottom-nav">
    <a class="bottom-nav-link" href="#tab=teams"><span>Teams</span></a>
    <a class="bottom-nav-link" href="#tab=results"><span>Results</span></a>
    <a class="bottom-nav-link" href="#tab=playoffs"><span>Playoffs</span></a>
  </nav>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
