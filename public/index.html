<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>High School Girls Soccer</title>
  <meta name="description" content="US high school girls soccer state championship brackets, results, champions and school histories. Coverage starts with California (CIF); more states are being added.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231d4ed8'/%3E%3Cpath d='M16 9l6 4.5-2.3 7h-7.4L10 13.5z' fill='%23fff'/%3E%3C/svg%3E">
  <script>
    try {
      const t = localStorage.getItem('hs-theme');
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#tab=playoffs">
      <span class="brand-mark" aria-hidden="true"></span>
      <span><strong>High School Girls Soccer</strong> <span class="brand-sub">US state playoffs</span></span>
    </a>
    <nav class="tabs" role="tablist" aria-label="Sections" id="tabs">
      <a role="tab" data-tab="playoffs" href="#tab=playoffs">Brackets</a>
      <a role="tab" data-tab="results" href="#tab=results">Results</a>
      <a role="tab" data-tab="champions" href="#tab=champions">Champions</a>
      <a role="tab" data-tab="schools" href="#tab=schools">Schools</a>
    </nav>
    <div class="search" id="search">
      <input type="search" id="search-input" placeholder="Find a school  /" aria-label="Find a school" autocomplete="off">
      <ul class="search-results" id="search-results" role="listbox" hidden></ul>
    </div>
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8C12.92 3.04 12.46 3 12 3z"/></svg>
    </button>
  </header>

  <div class="controls" id="controls"></div>
  <main id="view" class="view" aria-live="polite"></main>

  <footer class="footer">
    <span id="status-line">Coverage: California (CIF) for now, more states coming. Brackets from state associations; game data from MaxPreps.</span>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
